<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <style>
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url("{{ url_for('static', filename='background.jpg') }}");
            background-size: cover;
            background-position: center;
            filter: blur(8px);
            z-index: -1;
        }

        body {
            font-family: Arial, sans-serif;
            color: #fff;
            margin: 0;
            text-align: center;
            padding: 20px;
        }

        h1 { text-align: center; margin-top: 30px; }

        /* Dashboard container */
        .dashboard {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 50px;
            gap: 30px;
        }

        .dashboard .box {
            background: rgba(255,255,255,0.2);
            width: 220px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            font-size: 18px;
            font-weight: bold;
        }

        .dashboard .box:hover {
            transform: scale(1.05);
            background: rgba(255,255,255,0.35);
        }

        /* Disabled box style */
        .dashboard .box.disabled {
            background: rgba(255,255,255,0.1);
            cursor: not-allowed;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <!-- Include the new admin header -->
    {% include 'admin_header.html' %}

    {% if current_user.is_authenticated and current_user.is_admin %}
    <div style="margin: 20px 0; font-size:25px; font-weight:bold;">
        Hello, {{ current_user.username }}!
    </div>
    {% endif %}

    <h1>Admin Dashboard</h1>
    
    <div class="dashboard">
        <div class="box {% if not current_user.is_authenticated or not current_user.is_admin %}disabled{% endif %}" 
             onclick="if({{ 'true' if current_user.is_authenticated and current_user.is_admin else 'false' }}) { location.href='{{ url_for('manage_users') }}'; }">
             Manage Admin/Users
        </div>

        <div class="box {% if not current_user.is_authenticated or not current_user.is_admin %}disabled{% endif %}" 
             onclick="if({{ 'true' if current_user.is_authenticated and current_user.is_admin else 'false' }}) { location.href='{{ url_for('admin_messages') }}'; }">
             Messages
        </div>

        <div class="box {% if not current_user.is_authenticated or not current_user.is_admin %}disabled{% endif %}" 
             onclick="if({{ 'true' if current_user.is_authenticated and current_user.is_admin else 'false' }}) { location.href='{{ url_for('admin_recommendations') }}'; }">
             Recommendations
        </div>

        <div class="box {% if not current_user.is_authenticated or not current_user.is_admin %}disabled{% endif %}" 
             onclick="if({{ 'true' if current_user.is_authenticated and current_user.is_admin else 'false' }}) { location.href='{{ url_for('admin_about') }}'; }">
             About Us
        </div>
    </div>
    
</body>
</html>
