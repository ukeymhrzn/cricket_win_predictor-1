<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Cricket Predictor</title>
  <style>
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image: url("{{ url_for('static', filename='background.jpg') }}");
      background-size: cover;
      background-position: center;
      filter: blur(8px);
      z-index: -1;
    }
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(120deg, #007bff, #00c6ff);
      color: #fff;
      text-align: center;
      padding: 40px;
    }
    .container {
      background: rgba(255,255,255,0.15);
      padding: 30px;
      border-radius: 15px;
      width: 400px;
      margin: auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    input, select, button {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }
    button {
      background-color: #ffcc00;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease-in-out;
    }
    button:hover { background-color: #ffdb4d; }

    .flash { margin:10px 0; color:#ffdddd; font-size:14px; }

    /* Navbar reused */
    .navbar {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      z-index: 1000;
      display: flex;
      justify-content: center;
      background: rgba(255,255,255,0.15);
      padding: 10px 20px;
      border-radius: 0 0 10px 10px;
      align-items: center;
      gap: 30px;
    }
    .navbar a { color:#fff; text-decoration:none; font-weight:bold; margin:0 10px; }
    .navbar .dropdown { position: relative; display: inline-block; }
    .navbar .dropdown-content {
        display:none;
        position: fixed;
        background-color: rgba(0,0,0,0.7);
        min-width:120px;
        box-shadow:0 8px 16px rgba(0,0,0,0.2);
        border-radius:8px;
        z-index:1001;
    }
    .navbar .dropdown-content a { color:#fff; padding:8px 12px; display:block; text-decoration:none; }
    .navbar .dropdown:hover .dropdown-content { display:block; }
    body { padding-top:70px; }
  </style>

  <script>
function validateForm() {
    const email = document.forms["regForm"]["email"].value;
    const password = document.forms["regForm"]["password"].value;
    const confirmPassword = document.forms["regForm"]["confirm_password"].value;
    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const passwordPattern = /^(?=.*[A-Za-z])(?=.*\d).+$/; // at least one letter and one number

    if (!emailPattern.test(email)) {
        alert("Please enter a valid email.");
        return false;
    }
    if (password.length < 6) {
        alert("Password must be at least 6 characters.");
        return false;
    }
    if (!passwordPattern.test(password)) {
        alert("Password must contain at least one letter and one number.");
        return false;
    }
    if (password !== confirmPassword) {
        alert("Passwords do not match.");
        return false;
    }
    return true;
}
</script>


</head>
<body>

<div class="navbar">
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{{ url_for('message_us') }}">Message Us</a>
    <a href="{{ url_for('history') }}">History</a>
    <a href="{{ url_for('about') }}">About Us</a>

    <div class="dropdown">
        <a href="#">Account ▼</a>
        <div class="dropdown-content">
            <a href="{{ url_for('login') }}">Login</a>
            <a href="{{ url_for('register') }}">Register</a>
        </div>
    </div>
</div>

<div class="container">
    <h2>Register</h2>

    <!-- Only show errors -->
    {% with messages = get_flashed_messages(category_filter=["danger"]) %}
      {% if messages %}
        <div class="flash">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}

    <form name="regForm" method="POST" action="{{ url_for('register') }}" onsubmit="return validateForm()">
        <input type="text" name="username" placeholder="Username" required><br>
        <input type="email" name="email" placeholder="Email" required><br>
        <select name="gender" required>
            <option value="" disabled selected>Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>
        <input type="password" name="password" placeholder="Password (min 6 chars)" required><br>
        <input type="password" name="confirm_password" placeholder="Confirm Password" required><br>
        <button type="submit">Register</button>

        <p style="text-align:center; margin-top:10px;">
            Already have an account?
            <a href="{{ url_for('login') }}" style="color: #ffcc00; font-weight: bold;">Login here</a>
        </p>
    </form>
</div>

{% include 'footer.html' %}
</body>
</html>
